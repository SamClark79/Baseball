<style>
  :root{
    --ink:#0d1f24; --ink-2:#16323a; --ink-3:#224750;
    --fog:#eef4f6; --fog-dim:#9fbcc4;
    --blue:#3bb4ec; --blue-deep:#1877b8; --blue-ink:#135f92;
    --green:#b4e015; --green-deep:#8ab400;
    --pink:#f0509b;
    --grass:#4c8f4f; --grass-dark:#427f45;
    --dirt:#c9925e;
    --chalk:#fdfaf1;
    --shadow:0 2px 10px rgba(6,20,25,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--ink);
    color:var(--fog);
    font-family:'Nunito','Trebuchet MS',sans-serif;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }

  /* ── Header ─────────────────────────────── */
  header{
    display:flex; align-items:center; gap:14px;
    padding:10px 16px calc(10px) 16px;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:var(--ink);
    border-bottom:3px solid var(--green);
    flex:none;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .mark{width:38px; height:38px; border-radius:11px; flex:none; background:#fff; display:block;}
  h1{
    font-family:'Graduate','Arial Black',sans-serif;
    font-size:clamp(18px,3vw,26px); margin:0;
    letter-spacing:.06em; color:var(--fog); white-space:nowrap;
  }
  .tagline{font-size:12px; font-weight:700; color:var(--fog-dim); letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;}
  header .spacer{flex:1;}
  .hbtn{
    font-family:'Graduate','Arial Black',sans-serif; letter-spacing:.08em;
    font-size:13px; color:var(--fog);
    background:var(--ink-2); border:2px solid var(--ink-3);
    border-radius:999px; padding:10px 16px; cursor:pointer;
  }
  .hbtn:active{transform:translateY(1px);}
  .hbtn.warn{border-color:var(--pink); color:#ffb9d9;}
  .hbtn:focus-visible,.tbtn:focus-visible,button:focus-visible{outline:3px solid var(--green); outline-offset:2px;}

  /* ── Tip banner ─────────────────────────── */
  #tip{
    display:none; align-items:center; gap:12px;
    background:#2c5232; color:var(--chalk);
    padding:10px 16px; flex:none;
    border-bottom:2px dashed rgba(253,250,241,.35);
  }
  #tip.show{display:flex;}
  #tip .tip-title{
    font-family:'Graduate','Arial Black',sans-serif; font-size:14px;
    letter-spacing:.06em; color:var(--green); white-space:nowrap;
  }
  #tip .tip-text{font-size:clamp(14px,2.2vw,18px); font-weight:800; flex:1; min-width:0;}
  #tip .tip-close{
    background:none; border:none; color:var(--chalk); font-size:22px;
    font-weight:800; cursor:pointer; padding:4px 8px; line-height:1;
  }

  /* ── Main layout ────────────────────────── */
  main{flex:1; display:flex; min-height:0;}
  #rail{
    flex:none; width:104px; display:flex; flex-direction:column; gap:8px;
    padding:12px 10px calc(12px + env(safe-area-inset-bottom)) 12px;
    background:var(--ink); overflow-y:auto;
  }
  .tbtn{
    font-family:'Graduate','Arial Black',sans-serif; letter-spacing:.06em;
    font-size:12px; color:var(--fog);
    background:var(--ink-2); border:2px solid var(--ink-3);
    border-radius:14px; padding:12px 6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .tbtn svg{width:24px; height:24px; display:block;}
  .tbtn.on{background:var(--green); border-color:var(--green-deep); color:var(--ink);}
  .tbtn:active{transform:translateY(1px);}
  .tbtn[disabled]{opacity:.4; pointer-events:none;}
  .rail-gap{height:6px; flex:none; border-top:2px solid var(--ink-2); margin:4px 6px;}
  .swatches{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:2px 2px 4px;}
  .swatch{
    width:100%; aspect-ratio:1; border-radius:9px; cursor:pointer;
    border:2px solid rgba(255,255,255,.25); padding:0;
  }
  .swatch.on{border-color:#fff; box-shadow:0 0 0 2px var(--ink), 0 0 0 4px #fff;}
  #ballMenu{
    position:absolute; z-index:6; display:flex; flex-direction:column; gap:6px;
    background:var(--ink); border:2px solid var(--green); border-radius:14px;
    padding:8px; box-shadow:var(--shadow);
  }
  #ballMenu[hidden]{display:none;}
  #ballMenu button{
    font-family:'Graduate','Arial Black',sans-serif; font-size:12px; letter-spacing:.05em;
    color:var(--fog); background:var(--ink-2); border:2px solid var(--ink-3);
    border-radius:10px; padding:10px 14px; cursor:pointer; white-space:nowrap;
  }
  #ballMenu button:active{background:var(--green); color:var(--ink);}
  .sect{
    font-family:'Graduate','Arial Black',sans-serif; font-size:12px; letter-spacing:.08em;
    color:var(--green); margin:16px 2px 8px;
  }
  .sect:first-child{margin-top:2px;}
  .sect .sect-sub{display:block; font-family:'Nunito',sans-serif; font-size:12px;
    font-weight:700; letter-spacing:0; color:var(--fog-dim); margin-top:2px;}
  .lineup{background:var(--ink-2); border:2px solid var(--ink-3); border-radius:14px; padding:12px; margin-bottom:4px;}
  .lineup p{margin:0 0 10px; font-size:13px; font-weight:600; color:var(--fog-dim); line-height:1.45;}
  .lineup .btns{display:flex; gap:8px;}
  .lineup button{
    flex:1; font-family:'Graduate','Arial Black',sans-serif; font-size:11px; letter-spacing:.05em;
    border-radius:10px; padding:11px 6px; cursor:pointer;
    background:var(--blue-deep); border:2px solid var(--blue-ink); color:#fff;
  }
  .lineup button.ghost{background:var(--ink); border-color:var(--ink-3); color:var(--fog-dim);}
  #stepBadge{
    font-size:11px; font-weight:800; color:var(--green); letter-spacing:.05em;
    text-align:center; font-family:'Nunito',sans-serif;
  }

  #stage{flex:1; min-width:0; min-height:0; position:relative; background:#3c6f3f;}
  #field{
    position:absolute; inset:0; width:100%; height:100%;
    touch-action:none; display:block;
  }
  .piece{cursor:grab;}
  .piece text{pointer-events:none;}

  /* ── Toast ──────────────────────────────── */
  #toast{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px);
    background:var(--ink); color:var(--fog); font-weight:800; font-size:15px;
    padding:12px 20px; border-radius:999px; border:2px solid var(--green);
    box-shadow:var(--shadow); transition:transform .25s ease; pointer-events:none;
    max-width:80%; text-align:center;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}

  /* ── Side panel ─────────────────────────── */
  #scrim{position:fixed; inset:0; background:rgba(10,16,30,.5); display:none;}
  #scrim.show{display:block;}
  #panel{
    position:fixed; top:0; right:0; bottom:0; width:min(400px,92vw);
    background:var(--ink); border-left:3px solid var(--blue);
    transform:translateX(105%); transition:transform .25s ease;
    display:flex; flex-direction:column; z-index:10;
    padding-top:env(safe-area-inset-top);
  }
  #panel.show{transform:translateX(0);}
  .panel-head{display:flex; align-items:center; padding:14px 16px 0;}
  .ptabs{display:flex; gap:8px; flex:1;}
  .ptab{
    font-family:'Graduate','Arial Black',sans-serif; font-size:13px; letter-spacing:.06em;
    color:var(--fog-dim); background:none; border:none; cursor:pointer;
    padding:8px 4px; border-bottom:3px solid transparent;
  }
  .ptab.on{color:var(--fog); border-bottom-color:var(--green);}
  .panel-close{background:none; border:none; color:var(--fog); font-size:26px; cursor:pointer; padding:2px 10px;}
  .panel-body{flex:1; overflow-y:auto; padding:14px 16px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch;}
  .card{
    width:100%; text-align:left; background:var(--ink-2); border:2px solid var(--ink-3);
    border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; color:var(--fog);
    font-family:'Nunito',sans-serif; display:block;
  }
  .card:active{border-color:var(--green);}
  .card .c-title{font-weight:800; font-size:16px; margin-bottom:3px;}
  .card .c-sub{font-size:13px; color:var(--fog-dim); font-weight:600;}
  .card .c-anim{
    display:inline-block; margin-top:8px; font-size:11px; font-weight:800; letter-spacing:.08em;
    color:var(--ink); background:var(--green); border-radius:999px; padding:3px 10px;
  }
  .play-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .play-row .card{margin:0; flex:1;}
  .del{
    flex:none; width:44px; height:44px; border-radius:12px; border:2px solid var(--ink-3);
    background:var(--ink-2); color:#ff9ec9; font-size:18px; font-weight:800; cursor:pointer;
  }
  .del.confirm{background:var(--pink); color:#fff; font-size:11px; letter-spacing:.03em;}
  .save-row{display:flex; gap:8px; margin-bottom:16px;}
  .save-row input{
    flex:1; min-width:0; background:var(--ink-2); border:2px solid var(--ink-3); border-radius:12px;
    color:var(--fog); font:700 15px 'Nunito',sans-serif; padding:12px;
  }
  .save-row input::placeholder{color:var(--fog-dim);}
  .save-row button{
    flex:none; background:var(--blue-deep); border:2px solid var(--blue-ink); color:#fff;
    font-family:'Graduate','Arial Black',sans-serif; font-size:13px; letter-spacing:.06em;
    border-radius:12px; padding:0 18px; cursor:pointer;
  }
  .empty{color:var(--fog-dim); font-weight:600; font-size:14px; text-align:center; padding:30px 10px; line-height:1.5;}
  .empty img{width:92px; height:92px; border-radius:22px; display:block; margin:0 auto 12px;}

  /* ── Narrow screens: rail moves to bottom ── */
  @media (max-width:900px){
    .tagline{display:none;}
  }
  @media (max-width:640px){
    main{flex-direction:column;}
    #rail{
      order:2; width:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    }
    .tbtn{min-width:66px; padding:8px 4px;}
    .rail-gap{width:6px; height:auto; border-top:none; border-left:2px solid var(--ink-2); margin:6px 4px;}
  }
  @media (prefers-reduced-motion:reduce){
    #panel,#toast{transition:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="mark" id="brandMark" alt="Team mascot" src="">
    <h1>CHALK TALK</h1>
    <span class="tagline">6U Baseball Board</span>
  </div>
  <div class="spacer"></div>
  <button class="hbtn" id="btnLessons">Lessons</button>
  <button class="hbtn" id="btnSituations">Situations</button>
  <button class="hbtn" id="btnPlays">Plays</button>
  <button class="hbtn warn" id="btnReset">Reset</button>
</header>

<div id="tip">
  <span class="tip-title" id="tipTitle"></span>
  <span class="tip-text" id="tipText"></span>
  <button class="tip-close" id="tipClose" aria-label="Dismiss tip">&times;</button>
</div>

<main>
  <nav id="rail" aria-label="Tools">
    <button class="tbtn on" id="modeMove">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>
      MOVE
    </button>
    <button class="tbtn" id="modeDraw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"/></svg>
      DRAW
    </button>
    <div class="swatches" id="swatches"></div>
    <button class="tbtn" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      UNDO
    </button>
    <button class="tbtn" id="btnClear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
      CLEAR
    </button>
    <div class="rail-gap"></div>
    <button class="tbtn on" id="btnNames">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
      NAMES
    </button>
    <div class="rail-gap"></div>
    <button class="tbtn" id="btnStep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2M10 13h.01M7 16l3-3 4 4"/></svg>
      STEP +
    </button>
    <button class="tbtn" id="btnPlay">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 4l13 8-13 8z"/></svg>
      PLAY
    </button>
    <div id="stepBadge"></div>
    <button class="tbtn" id="btnClearSteps" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      NO STEPS
    </button>
  </nav>

  <div id="stage">
    <svg id="field" viewBox="0 0 1000 940" preserveAspectRatio="xMidYMid meet" aria-label="Baseball field board"></svg>
    <div id="ballMenu" hidden>
      <button data-kind="ground">GROUND BALL</button>
      <button data-kind="fly">FLY BALL</button>
      <button data-kind="line">LINE DRIVE</button>
    </div>
    <div id="toast" role="status"></div>
  </div>
</main>

<div id="scrim"></div>
<aside id="panel" aria-label="Lessons and saved plays">
  <div class="panel-head">
    <div class="ptabs">
      <button class="ptab on" id="tabLessons">LESSONS</button>
      <button class="ptab" id="tabSituations">SITUATIONS</button>
      <button class="ptab" id="tabPlays">PLAYS</button>
    </div>
    <button class="panel-close" id="panelClose" aria-label="Close panel">&times;</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

// Older saves stored a bare point array; normalise everything to {kind,color,pts}.
function normChalk(c){
  if(Array.isArray(c)) return {kind:'arrow', color:'#fdfaf1', pts:c};
  return {kind:c.kind||'arrow', color:c.color||'#fdfaf1', pts:c.pts||[]};
}
function head(g,from,to,color,w){
  const a=Math.atan2(to[1]-from[1],to[0]-from[0]), s=21;
  const p1=[to[0]-s*Math.cos(a-0.45),to[1]-s*Math.sin(a-0.45)];
  const p2=[to[0]-s*Math.cos(a+0.45),to[1]-s*Math.sin(a+0.45)];
  el('path',{d:`M${p1[0]} ${p1[1]} L${to[0]} ${to[1]} L${p2[0]} ${p2[1]}`,fill:'none',
    stroke:color,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.95},g);
}
function renderChalk(){
  chalkLayer.textContent='';
  chalk.forEach(raw=>{
    const c=normChalk(raw), pts=c.pts, col=c.color;
    if(pts.length<2) return;
    const g=el('g',{},chalkLayer);
    const a=pts[0], b=pts[pts.length-1];
    if(c.kind==='arrow'){
      const d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
      el('path',{d,fill:'none',stroke:col,'stroke-width':7,'stroke-linecap':'round',
        'stroke-linejoin':'round',opacity:.92},g);
      let j=pts.length-2;
      while(j>0 && Math.hypot(b[0]-pts[j][0],b[1]-pts[j][1])<14) j--;
      head(g,pts[j],b,col,7);
    }else if(c.kind==='fly'){
      // arc that bulges upward, the way a fly ball looks from the dugout
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
      let nx=-dy/len, ny=dx/len;
      if(ny>0){ nx=-nx; ny=-ny; }
      const cx=mx+nx*len*0.34, cy=my+ny*len*0.34;
      el('path',{d:`M${a[0]} ${a[1]} Q${cx} ${cy} ${b[0]} ${b[1]}`,fill:'none',stroke:col,
        'stroke-width':7,'stroke-linecap':'round',opacity:.92},g);
      head(g,[cx,cy],b,col,7);
    }else{
      // ground ball = dotted, line drive = solid; both dead straight
      const dotted = c.kind==='ground';
      el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,
        'stroke-width':dotted?9:8,'stroke-linecap':'round',opacity:.92,
        ...(dotted?{'stroke-dasharray':'0.1 22'}:{})},g);
      head(g,a,b,col,8);
    }
  });
}

/* ================= Pointer interaction ================= */
function toField(evt){
  const ctm = svg.getScreenCTM();
  if(!ctm) return null;
  const pt = svg.createSVGPoint();
  pt.x=evt.clientX; pt.y=evt.clientY;
  const p = pt.matrixTransform(ctm.inverse());
  return [Math.max(14,Math.min(986,p.x)), Math.max(14,Math.min(926,p.y))];
}

function screenOf(pt){
  const ctm=svg.getScreenCTM(); if(!ctm) return null;
  const p=svg.createSVGPoint(); p.x=pt[0]; p.y=pt[1];
  const s=p.matrixTransform(ctm);
  const box=document.getElementById('stage').getBoundingClientRect();
  return [s.x-box.left, s.y-box.top];
}

    if(Math.hypot(p[0]-last[0],p[1]-last[1])>6){ sketch.pts.push(p); renderChalk(); }
  }else if(drag){

  cancelLongPress();
  if(sketch && sketch.pts.length<3){ chalk.pop(); renderChalk(); }
  if(armedTrail && drag && drag.id==='BALL' && trailStart){
    const end=positions.BALL.slice();
    if(Math.hypot(end[0]-trailStart[0],end[1]-trailStart[1])>34){
      chalk.push({kind:armedTrail, color:drawColor, pts:[trailStart,end]});
      armedTrail=null; renderChalk();
    }
  }
  if(sketch||drag) saveBoard();
  sketch=null; drag=null; trailStart=null;
}

/* ================= Animation ================= */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let playToken=0;

function lerpPositions(a,b,t){
  const e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;   // easeInOutCubic
  for(const id in positions){
    const p0=a[id]||positions[id], p1=b[id]||p0;
    positions[id]=[p0[0]+(p1[0]-p0[0])*e, p0[1]+(p1[1]-p0[1])*e];
  }
  render();
}

function play(){
  if(playing){ playToken++; playing=false; $('btnPlay').classList.remove('on'); return; }
  if(steps.length<2){ toast('Set the field, tap STEP + — move players — tap STEP + again. Then press PLAY.'); return; }
  playing=true; $('btnPlay').classList.add('on');
  const token=++playToken;
  const seq=steps.map(s=>{
    const c={}; for(const id in s) c[id]=s[id].slice(); return c;
  });
  const DUR = reduceMotion?0:850, PAUSE=reduceMotion?600:280;
  let i=0;
  for(const id in seq[0]) positions[id]=seq[0][id].slice();
  render();
  function nextLeg(){
    if(token!==playToken) return;
    if(i>=seq.length-1){
      playing=false; $('btnPlay').classList.remove('on'); saveBoard(); return;
    }
    const a=seq[i], b=seq[i+1];
    const t0=performance.now();
    function frame(now){
      if(token!==playToken) return;
      const t=DUR?Math.min(1,(now-t0)/DUR):1;
      lerpPositions(a,b,t);
      if(t<1) requestAnimationFrame(frame);
      else { i++; setTimeout(nextLeg,PAUSE); }
    }
    requestAnimationFrame(frame);
  }
  setTimeout(nextLeg,PAUSE);
}
$('btnPlay').onclick=play;

  positions=p; chalk=[]; steps=[];
  render(); renderChalk(); updateStepUI(); saveBoard();
  showTip(state.title, (side==='offense'?OFFENSE_TIPS:DEFENSE_TIPS)[state.key]);
  closePanel();
}

/* ================= Saved plays ================= */
const PLAYS_KEY='chalktalk.plays.v1', BOARD_KEY='chalktalk.board.v1';
function loadStore(key,fallback){
  try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }
  catch(e){ return fallback; }
}
function saveStore(key,val){
  try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){}
}
let plays = loadStore(PLAYS_KEY,[]);
customLineup = loadStore(LINEUP_KEY,null);

let saveTimer;
function saveBoard(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    saveStore(BOARD_KEY,{positions,chalk,steps,namesOn,drawColor});
  },300);
}
(function restoreBoard(){
  const b=loadStore(BOARD_KEY,null);
  if(b && b.positions){
    const d=defaultPositions();
    for(const id in d) if(b.positions[id]) d[id]=b.positions[id];
    positions=d;
    chalk=(Array.isArray(b.chalk)?b.chalk:[]).map(normChalk);
    steps=Array.isArray(b.steps)?b.steps:[];
    namesOn=!!b.namesOn;
    if(b.drawColor && COLORS.some(c=>c.hex===b.drawColor)) drawColor=b.drawColor;
  }
  $('btnNames').classList.toggle('on',namesOn);
})();

/* ================= Panel ================= */
let panelTab='lessons', confirmIdx=-1;
function openPanel(tab){
  panelTab=tab; confirmIdx=-1;
  renderPanel();
  $('panel').classList.add('show');
  $('scrim').classList.add('show');
}
function closePanel(){
  $('panel').classList.remove('show');
  $('scrim').classList.remove('show');
}
$('btnLessons').onclick=()=>openPanel('lessons');
$('btnSituations').onclick=()=>openPanel('situations');
$('btnPlays').onclick=()=>openPanel('plays');
$('panelClose').onclick=closePanel;
$('scrim').onclick=closePanel;
$('tabLessons').onclick=()=>{panelTab='lessons';renderPanel();};
$('tabSituations').onclick=()=>{panelTab='situations';renderPanel();};
$('tabPlays').onclick=()=>{panelTab='plays';confirmIdx=-1;renderPanel();};

function sectionHead(body,label,sub){
  const h=document.createElement('div');
  h.className='sect';
  h.textContent=label;
  if(sub){ const s=document.createElement('span'); s.className='sect-sub'; s.textContent=sub; h.appendChild(s); }
  body.appendChild(h);
}
function situationCard(body,state,side){
  const b=document.createElement('button');
  b.className='card';
  b.innerHTML='<div class="c-title"></div><div class="c-sub"></div>';
  b.querySelector('.c-title').textContent=state.title;
  b.querySelector('.c-sub').textContent =
    side==='offense' ? 'Your Base Invaders on base' : 'Other team on base';
  b.onclick=()=>loadSituation(state,side);
  body.appendChild(b);
}
function lineupBlock(body){
  const box=document.createElement('div');
  box.className='lineup';
  const p=document.createElement('p');
  p.textContent=customLineup
    ? 'Situations and RESET use your saved lineup. Move players, then save again to update it.'
    : 'Using the standard alignment. Drag your fielders where you want them, then save it as your lineup — Situations and RESET will use it.';
  const btns=document.createElement('div');
  btns.className='btns';
  const save=document.createElement('button');
  save.textContent='SAVE FIELD AS MY LINEUP';
  save.onclick=()=>{
    customLineup=snapshot();
    saveStore(LINEUP_KEY,customLineup);
    renderPanel();
    toast('Saved as your lineup');
  };
  btns.appendChild(save);
  if(customLineup){
    const std=document.createElement('button');
    std.className='ghost'; std.textContent='USE STANDARD';
    std.onclick=()=>{
      customLineup=null;
      saveStore(LINEUP_KEY,null);
      renderPanel();
      toast('Back to the standard alignment');
    };
    btns.appendChild(std);
  }
  box.appendChild(p); box.appendChild(btns);
  body.appendChild(box);
}

function renderPanel(){
  $('tabLessons').classList.toggle('on',panelTab==='lessons');
  $('tabSituations').classList.toggle('on',panelTab==='situations');
  $('tabPlays').classList.toggle('on',panelTab==='plays');
  const body=$('panelBody');
  body.textContent='';
  if(panelTab==='situations'){
    sectionHead(body,'MY LINEUP');
    lineupBlock(body);
    sectionHead(body,'OFFENSE','We are batting — teach the runners where to go.');
    BASE_STATES.forEach(s=>situationCard(body,s,'offense'));
    sectionHead(body,'DEFENSE','They are batting — teach the fielders where to throw.');
    BASE_STATES.forEach(s=>situationCard(body,s,'defense'));
  }else if(panelTab==='lessons'){
    LESSONS.forEach(les=>{
      const b=document.createElement('button');
      b.className='card';
      b.innerHTML='<div class="c-title"></div><div class="c-sub"></div>'+
        (les.steps.length>1?'<span class="c-anim">ANIMATED</span>':'');
      b.querySelector('.c-title').textContent=les.title;
      b.querySelector('.c-sub').textContent=les.sub;
      b.onclick=()=>loadLesson(les);
      body.appendChild(b);
    });
  }else{
    const row=document.createElement('div');
    row.className='save-row';
    row.innerHTML='<input id="playName" placeholder="Name this play…" maxlength="40"><button id="btnSave">SAVE</button>';
    body.appendChild(row);
    row.querySelector('#btnSave').onclick=()=>{
      const inp=row.querySelector('#playName');
      const name=inp.value.trim()||('Play '+(plays.length+1));
      plays.unshift({name, when:new Date().toLocaleDateString(),
        board:{positions:snapshot(),chalk:JSON.parse(JSON.stringify(chalk)),
               steps:JSON.parse(JSON.stringify(steps)),namesOn}});
      saveStore(PLAYS_KEY,plays);
      inp.value='';
      renderPanel();
      toast('Saved “'+name+'”');
    };
    if(!plays.length){
      const e=document.createElement('div');
      e.className='empty';
      const m=document.createElement('img'); m.src=MASCOT; m.alt='';
      const t=document.createElement('div');
      t.textContent='No saved plays yet. Set up the field the way you want, then save it here for next practice.';
      e.appendChild(m); e.appendChild(t);
      body.appendChild(e);
    }
    plays.forEach((pl,idx)=>{
      const wrap=document.createElement('div');
      wrap.className='play-row';
      const b=document.createElement('button');
      b.className='card';
      b.innerHTML='<div class="c-title"></div><div class="c-sub"></div>';
      b.querySelector('.c-title').textContent=pl.name;
      b.querySelector('.c-sub').textContent='Saved '+pl.when+
        (pl.board.steps.length>1?' · '+pl.board.steps.length+' steps':'');
      b.onclick=()=>{
        playToken++; playing=false; $('btnPlay').classList.remove('on');
        const d=defaultPositions();
        for(const id in d) if(pl.board.positions[id]) d[id]=pl.board.positions[id];
        positions=d;
        chalk=JSON.parse(JSON.stringify(pl.board.chalk||[])).map(normChalk);
        steps=JSON.parse(JSON.stringify(pl.board.steps||[]));
        namesOn=!!pl.board.namesOn;
        $('btnNames').classList.toggle('on',namesOn);
        $('tip').classList.remove('show');
        render(); renderChalk(); updateStepUI(); saveBoard();
        closePanel();
        toast('Loaded “'+pl.name+'”');
      };
      const del=document.createElement('button');
      del.className='del'; del.textContent='×';
      del.setAttribute('aria-label','Delete '+pl.name);
      del.onclick=()=>{
        if(confirmIdx===idx){
          plays.splice(idx,1); saveStore(PLAYS_KEY,plays); confirmIdx=-1; renderPanel();
        }else{
          confirmIdx=idx; renderPanel();
        }
      };
      if(confirmIdx===idx){ del.classList.add('confirm'); del.textContent='SURE?'; }
      wrap.appendChild(b); wrap.appendChild(del);
      body.appendChild(wrap);
    });
  }
}

/* ================= Boot ================= */
document.getElementById('brandMark').src=MASCOT;
if(!loadStore(BOARD_KEY,null)) positions=defaultPositions();
render(); renderChalk(); updateStepUI();
if(!loadStore(BOARD_KEY,null)){
  showTip('Welcome, Coach!','Drag players with a finger. Hold the ball to draw a hit. Tap DRAW to chalk arrows, or open SITUATIONS to set up the bases.');
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
